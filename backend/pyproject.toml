[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relay-backend"
version = "0.1.0"
description = "Cloud persistence POC for canonical browser workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic",
  "boto3",
  "fastapi",
  "httpx2",
  "psycopg[binary,pool]",
  "pydantic-settings",
  "pyyaml",
  "scalar-fastapi>=1.8.2",
  "sqlalchemy",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
  "jsonschema",
  "openapi-spec-validator",
  "pytest",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/relay_backend"]

[tool.hatch.build.targets.wheel.force-include]
"openapi.yaml" = "relay_backend/openapi.yaml"

[tool.hatch.build.hooks.custom]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
